<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Starting Lineup</title>
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Starting Lineup</h1>

  <form id="lineupForm">
    <p>
      <fieldset>
        <legend>Status:</legend>
        <input type="radio" id="draft" name="status" value="Draft">
        <label for="draft">Draft</label>
        <input type="radio" id="final" name="status" value="Final" checked>
        <label for="final">Final</label>
      </fieldset>
    </p>

    <p>
      <label for="gameDate">Date:</label>
      <select id="gameDate" name="gameDate">
        <option value="March 20">March 20</option>
        <option value="March 24">March 24</option>
        <option value="April 2">April 2</option>
        <option value="April 6">April 6</option>
        <option value="April 13">April 13</option>
      </select>
    </p>

    <p>
      <fieldset>
        <legend>Players:</legend>
        <input type="checkbox" id="player1" name="players" value="Aarav Agarwal">
        <label for="player1">Aarav Agarwal</label><br>
        <input type="checkbox" id="player2" name="players" value="Ava Johnson">
        <label for="player2">Ava Johnson</label><br>
        <input type="checkbox" id="player3" name="players" value="Julio Ortiz">
        <label for="player3">Julio Ortiz</label><br>
        <input type="checkbox" id="player4" name="players" value="Liam Rubio">
        <label for="player4">Liam Rubio</label><br>
        <input type="checkbox" id="player5" name="players" value="Emma Witherspoon">
        <label for="player5">Emma Witherspoon</label>
      </fieldset>
    </p>

    <p>
      <input type="submit" id="submitBtn" value="Submit">
    </p>
  </form>

  <p id="result"></p>
</body>
</html>
